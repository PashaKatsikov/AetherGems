name: aethergems
description: Aether Gems — chain lightning arena on Olympus.
publish_to: "none"
version: 1.0.1+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  audioplayers: 6.4.0
  shared_preferences: 2.3.4
  wakelock_plus: 1.2.8
  webview_flutter: 4.12.0
  webview_flutter_android: 4.5.0
  connectivity_plus: 6.0.4
  appsflyer_sdk: 6.14.3
  firebase_core: 3.8.1
  firebase_messaging: 15.1.6
  firebase_app_check: 0.3.1+6
  flutter_local_notifications: 17.2.4
  http: 1.2.2
  crypto: 3.0.7
  url_launcher: 6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/Aether_Gems_additional_assets/
    - assets/Aether_Gems_gameplay_assets/
    - assets/Aether_Gems_sounds_assets/
